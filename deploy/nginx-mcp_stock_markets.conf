# Host nginx site — copy to /etc/nginx/sites-enabled/mcp_stock_markets.conf.
# Replace app.example.com with your domain. TLS is managed by certbot; run
# `certbot --nginx -d <your domain>` once.
# deploy-prod.sh switches the proxy_pass port between blue and green; both start
# at APP_PORT_BLUE from .env. The deploy user owns this file (not the directory)
# and may run `nginx -t` and `nginx -s reload` through sudo — see the README.

# Rate-limit authentication: sign-in links.
limit_req_zone $binary_remote_addr zone=mcp_stock_markets_auth:10m rate=10r/m;

server {
    server_name app.example.com;
    listen 80;
    listen [::]:80;

    # Explicit body ceiling: nothing is uploaded, the largest request is a
    # language model connection's settings, a few hundred bytes.
    client_max_body_size 1m;

    # HSTS lives here — nginx owns TLS; the app speaks plain HTTP on the loopback,
    # where browsers ignore HSTS. Effective once certbot promotes this block to 443.
    # The canonical value is 2 years (63072000, the hstspreload.org requirement) —
    # keep it identical across apps; do not pick a different max-age per app.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The remaining security headers (CSP, X-Frame-Options, Permissions-Policy) are
    # set by the app middleware — defined in exactly one place, never duplicated here.

    location /api/auth/ {
        limit_req zone=mcp_stock_markets_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        # The app trusts X-Real-IP and X-Forwarded-Proto from this proxy only.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only for an app with websockets: forward the upgrade, and let a quiet
    # connection live longer than nginx's 60s default.
    # location /api/ws/ {
    #     proxy_pass http://127.0.0.1:8150;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 1h;
    # }

    # The MCP servers are for the agent inside the app, which reaches them on
    # the container's own loopback: from the internet, they do not exist. The
    # broker places orders, so this is the first of two locks; the second is
    # the bearer token the app checks on every MCP request (McpGuard).
    location /mcp/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        # The app trusts X-Real-IP and X-Forwarded-Proto from this proxy only.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
